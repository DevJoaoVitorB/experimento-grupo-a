services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./data/app.db
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Defina JWT_ACCESS_SECRET no ambiente}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET no ambiente}
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
