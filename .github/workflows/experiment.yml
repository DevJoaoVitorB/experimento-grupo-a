name: Authentication API Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Verifica a qualidade básica e a capacidade de compilação.
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run automated tests
        run: npm test

      - name: Build application
        run: npm run build

  # Analisa o código-fonte sem executar a API.
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
              --config p/security-audit \
              --config p/secrets \
              --config p/owasp-top-ten \
              --config p/javascript \
              --config p/typescript \
              --config p/nodejs \
              --config p/jwt \
              --config /src/.github/workflows/sast-rs01-rs07-rules.yml \
              --json \
              --output sast-report.json \
              .

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.json
          if-no-files-found: warn

  # Analisa dependências em busca de vulnerabilidades conhecidas.
  sca:
    name: SCA - npm audit
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit SCA
        shell: bash
        run: |
          set +e
          npm audit --json > sca-report.json
          result=$?
          echo "$result" > npm-audit-exit-code.txt
          set -e

          echo "npm audit exit code: $result"
          echo "Verifique o relatório e os logs para distinguir vulnerabilidades de falhas operacionais."

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: |
            sca-report.json
            npm-audit-exit-code.txt
          if-no-files-found: warn
          retention-days: 90

  # Analisa a API em execução em busca de vulnerabilidades de segurança.
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate DAST configuration
        run: |
          test -f Dockerfile
          test -f docker-compose.yml
          test -f .github/workflows/openapi.yml

      - name: Start API with Docker Compose
        run: docker compose up --build -d

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              echo "API is responding."
              exit 0
            fi

            echo "Waiting for API... attempt ${attempt}/30"
            sleep 2
          done

          echo "API did not become available."
          docker compose logs
          exit 1

      - name: Run OWASP ZAP API Scan
        id: zap
        continue-on-error: true
        shell: bash
        run: |
          set +e

          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t /zap/wrk/.github/workflows/openapi.yml \
              -f openapi \
              -r dast-report.html \
              -J dast-report.json \
              -w dast-report.md \
              -I

          result=$?
          echo "$result" > zap-exit-code.txt
          echo "OWASP ZAP exit code: $result"
          exit "$result"

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: |
            dast-report.html
            dast-report.json
            dast-report.md
            zap-exit-code.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Show API logs
        if: always()
        run: docker compose logs || true

      - name: Stop API containers
        if: always()
        run: docker compose down --volumes --remove-orphans
