name: Authentication API Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Verifica a qualidade básica e a capacidade de compilação.
  validate:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Application
        run: npm run build

  # Analisa o código-fonte sem executar a API.
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
              --config p/security-audit \
              --config p/secrets \
              --json \
              --output semgrep-report.json .

      - name: Upload SAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: semgrep-report.json
          if-no-files-found: warn

  # Verifica vulnerabilidades conhecidas nas dependências npm.
  sca:
    name: SCA - npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Dependencies
        shell: bash
        run: |
          set +e
          npm audit --json > sca-report.json
          result=$?
          echo "$result" > npm-audit-exit-code.txt
          set -e

          echo "npm audit exit code: $result"
          echo "Consulte o relatório e verifique se houve erro operacional."

      - name: Upload SCA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: |
            sca-report.json
            npm-audit-exit-code.txt
          if-no-files-found: warn

  # Analisa o arquivo gerado pelo próprio agente de IA.
  dockerfile:
    name: Dockerfile Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile
        run: test -f Dockerfile

      - name: Run Hadolint
        run: |
          docker run --rm -i hadolint/hadolint:latest hadolint \
            --failure-threshold none \
            --format json - \
            < Dockerfile > hadolint-report.json

      - name: Run Checkov
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            bridgecrew/checkov \
            --file Dockerfile \
            --framework dockerfile \
            --output json \
            --soft-fail \
            > checkov-report.json

      - name: Upload Dockerfile Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockerfile-reports
          path: |
            hadolint-report.json
            checkov-report.json
          if-no-files-found: warn

  # Construção e publicação da imagem docker
  publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    needs:
      - validate
      - sast
      - sca
      - dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:grupo-a
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}
