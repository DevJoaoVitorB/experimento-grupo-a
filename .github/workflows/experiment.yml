name: Authentication API Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Valida a aplicação antes das análises de segurança.
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run automated tests
        run: npm test

      - name: Build application
        run: npm run build

  # 2. Analisa o código-fonte, sem executar a API, em busca de possíveis vulnerabilidades. 
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
              --config p/security-audit \
              --config p/secrets \
              --config p/owasp-top-ten \
              --config p/javascript \
              --config p/typescript \
              --config p/nodejs \
              --config p/jwt \
              --config /src/.github/workflows/sast-rs01-rs07.yml \
              --json \
              --output sast-report.json \
              .

      # Armazena os resultados e o código de saída da análise.
      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.json
          if-no-files-found: warn

  # 3. Verifica dependências em busca de vulnerabilidades conhecidas.
  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gera o relatório mesmo quando o npm audit encontra problemas.
      - name: Run npm audit SCA
        shell: bash
        run: |
          set +e
          npm audit --json > sca-report.json
          result=$?
          echo "$result" > npm-audit-exit-code.txt
          set -e

          echo "npm audit exit code: $result"

      # Armazena os resultados e o código de saída da análise.
      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: |
            sca-report.json
            npm-audit-exit-code.txt
          if-no-files-found: warn
          retention-days: 90

  # 4. Analisa a API em execução em busca de vulnerabilidades de segurança.
  dast:
    name: DAST (OWASP ZAP + Complementary Tests)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30

    # Define segredos exclusivos do ambiente de teste.
    env:
      JWT_ACCESS_SECRET: "dast-test-access-secret-CHANGE-ME-123456789"
      JWT_REFRESH_SECRET: "dast-test-refresh-secret-CHANGE-ME-123456789"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Inicia a API em contêineres Docker.
      - name: Start API
        run: docker compose up --build -d

      # Aguarda a API responder antes de iniciar os testes.
      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs
          exit 1

      # Prepara a pasta para armazenar os relatórios.
      - name: Prepare DAST reports
        run: |
          mkdir -p "$RUNNER_TEMP/zap-reports"
          chmod 777 "$RUNNER_TEMP/zap-reports"

      # Examina a API com base na especificação OpenAPI.
      - name: Run OWASP ZAP
        continue-on-error: true
        shell: bash
        run: |
          set +e

          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "$PWD:/zap/wrk/:ro" \
            -v "$RUNNER_TEMP/zap-reports:/zap/reports/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t /zap/wrk/.github/workflows/openapi.yml \
              -f openapi \
              -r /zap/reports/dast-report.html \
              -J /zap/reports/dast-report.json \
              -w /zap/reports/dast-report.md \
              -I

          result=$?
          echo "$result" > "$RUNNER_TEMP/zap-reports/zap-exit-code.txt"
          echo "OWASP ZAP exit code: $result"
          exit 0

      # Testa comportamentos específicos das recomendações RS01–RS07.
      - name: Run complementary tests
        continue-on-error: true
        shell: bash
        env:
          DAST_BASE_URL: http://localhost:3000
          DAST_REPORT_PATH: ${{ runner.temp }}/zap-reports/dast-rs01-rs07-report.json
        run: |
          set +e

          node --experimental-strip-types .github/workflows/dast-rs01-rs07.test.ts

          result=$?
          echo "$result" > "$RUNNER_TEMP/zap-reports/complementary-exit-code.txt"
          echo "Complementary tests exit code: $result"
          exit 0

      # Armazena os resultados e o código de saída da análise.
      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: ${{ runner.temp }}/zap-reports/
          if-no-files-found: warn
          retention-days: 90

      # Encerra os contêineres e remove os volumes de teste.
      - name: Stop API
        if: always()
        run: docker compose down --volumes --remove-orphans
