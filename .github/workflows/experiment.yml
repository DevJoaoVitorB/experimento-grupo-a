name: Authentication API Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Verifica a qualidade básica e a capacidade de compilação.
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run automated tests
        run: npm test

      - name: Build application
        run: npm run build

  # Analisa o código-fonte sem executar a API.
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
              --config p/security-audit \
              --config p/secrets \
              --config p/owasp-top-ten \
              --config p/javascript \
              --config p/typescript \
              --config p/nodejs \
              --config p/jwt \
              --config sast-rs01-rs07.yml \
              --json \
              --output sast-report.json \
              .

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: sast-report.json
          if-no-files-found: warn

  # Analisa dependências em busca de vulnerabilidades conhecidas.
  sca:
    name: SCA - npm audit
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit SCA
        shell: bash
        run: |
          set +e
          npm audit --json > sca-report.json
          result=$?
          echo "$result" > npm-audit-exit-code.txt
          set -e

          echo "npm audit exit code: $result"
          echo "Verifique o relatório e os logs para distinguir vulnerabilidades de falhas operacionais."

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: |
            sca-report.json
            npm-audit-exit-code.txt
          if-no-files-found: warn
          retention-days: 90
